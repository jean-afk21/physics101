<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physics Hoops</title>
<style>
:root{
  --bg:#0b1020; --panel:#161d33; --accent:#f97316; --accent2:#fb923c;
  --text:#f5f7ff; --sub:#93a0c2; --good:#22c55e; --aim:#60a5fa;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 50% 0%,#1c2547,#0b1020 70%);
  color:var(--text);min-height:100%;display:flex;justify-content:center;align-items:center;
  padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0);
}
.wrap{width:100%;max-width:1000px}
.stage{position:relative;container-type:inline-size;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px #0008}
#gameCanvas{width:100%;height:auto;display:block;background:#87ceeb;cursor:crosshair;touch-action:none}

/* ---------- on-screen HUD (everything sits on top of the game) ---------- */
.hud{position:absolute;inset:0;z-index:2;pointer-events:none;font-size:max(10px,1.3cqw);color:#fff}
.hud button,.hud .settings{pointer-events:auto}

/* physics readout: small, translucent, top-left */
.phys{
  position:absolute;left:1.6cqw;top:1.6cqw;min-width:15cqw;
  background:rgba(10,16,36,.97);border-radius:.9cqw;padding:.8cqw 1cqw;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.7);
  backdrop-filter:blur(2px);
}
.phys .row{display:grid;grid-template-columns:5.6cqw 1fr 3.4cqw;align-items:baseline;gap:.4cqw;line-height:1.55}
.phys .row span{opacity:.9;font-size:.9em;font-weight:600}
.phys .row b{text-align:right;font-weight:700}
.phys .row i{font-style:normal;opacity:.82;font-size:.85em}
.phys .row.aim b{color:#9cc9ff}
.phys .row.hot b{color:#ffb35c}
.phys .row.hot b::after{content:" 🔥"}
.phys .sep{height:1px;background:rgba(255,255,255,.2);margin:.4cqw 0}

/* top centre: level + score */
.top{position:absolute;top:1.2cqw;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5cqw}
.level{background:rgba(10,16,36,.5);padding:.3cqw 1.2cqw;border-radius:99px;font-weight:700;letter-spacing:.08em;font-size:.95em;text-shadow:0 1px 2px #000a}
.pips{display:flex;gap:.6cqw;align-items:center;justify-content:center;min-height:1.8cqw}
.pips i{width:1.1cqw;height:1.1cqw;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(10,16,36,.35)}
.pips i.on{background:var(--accent);border-color:#fff}
.heart{display:inline-block;font-size:1.25em;line-height:1;color:#f87171;opacity:.25;filter:drop-shadow(0 0 8px rgba(248,113,113,.4));}
.heart.on{opacity:1}
.timer-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:130px;padding:4px 10px;border-radius:12px;background:rgba(15,23,42,.45);border:1px solid rgba(255,255,255,.15)}
.timer-wrap.low{animation:pulseTimer 0.7s ease-in-out infinite}
@keyframes pulseTimer{0%,100%{box-shadow:0 0 0 rgba(239,68,68,0);transform:scale(1)}50%{box-shadow:0 0 16px rgba(239,68,68,.7);transform:scale(1.02)}}
.timer-value{font-size:1.75em;font-weight:900;letter-spacing:.08em;color:#fff}
.timer-value.low{color:#fca5a5}
.timer-bar{width:110px;height:6px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.timer-fill{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#fbbf24,#ef4444);border-radius:inherit;transition:width .15s linear,background .15s linear}
.bonus-pop{position:absolute;transform:translate(-50%, -90%);font-size:.7em;font-weight:800;letter-spacing:.08em;color:#a7f3d0;text-shadow:0 0 10px rgba(74,222,128,.9);animation:bonusFloat .8s ease-out forwards}
@keyframes bonusFloat{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}
.scorebar{display:flex;gap:.7cqw;align-items:stretch}
.chip{background:rgba(10,16,36,.5);border-radius:.9cqw;padding:.4cqw 1.1cqw;text-align:center;min-width:6cqw;text-shadow:0 1px 2px #000a}
.chip b{display:block;font-size:1.7em;line-height:1.15;color:#fff}
.chip span{font-size:.75em;letter-spacing:.1em;opacity:.7}
.chip.main b{font-size:2.4em;color:var(--accent2)}
.chip-streak small{display:block;margin-top:2px;font-size:.55em;line-height:1.1;letter-spacing:.14em;color:#fbbf24;opacity:0;transition:opacity .15s}
.chip-streak small.on{opacity:1}

/* top right: round icon buttons */
.tools{position:absolute;top:1.2cqw;right:1.4cqw;display:flex;gap:.8cqw}
.icon{
  width:max(32px,3.8cqw);height:max(32px,3.8cqw);border-radius:50%;padding:0;line-height:1;
  position:relative;display:grid;place-items:center;background:rgba(10,16,36,.5);color:#fff;
  border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(3px);
}
.icon svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon svg[hidden]{display:none}
#soundOffIcon{stroke-width:3}
#physButton::after,#muteButton::after{content:"";position:absolute;right:2px;bottom:2px;width:7px;height:7px;border-radius:50%;background:#94a3b8;border:1px solid rgba(255,255,255,.9)}
#physButton.physics-on::after{background:#4ade80;box-shadow:0 0 5px #4ade80}
#muteButton.sound-on::after{background:#4ade80;box-shadow:0 0 5px #4ade80}
.icon:hover{background:rgba(10,16,36,.75)}
.settings{
  position:absolute;top:calc(max(32px,3.8cqw) + 2.4cqw);right:1.4cqw;
  background:rgba(10,16,36,.85);border:1px solid rgba(255,255,255,.2);border-radius:1cqw;
  padding:1cqw 1.4cqw;display:grid;gap:.8cqw;font-size:1.05em;
}
.settings label{display:flex;align-items:center;gap:.8cqw;cursor:pointer;white-space:nowrap}
.settings input{width:1.3em;height:1.3em;accent-color:var(--accent)}

/* bottom: shoot button (lock mode only) and hint line */
button{border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:transform .1s,filter .15s}
button:active{transform:scale(.95)}
#shootButton{
  position:absolute;left:50%;bottom:7.5cqw;transform:translateX(-50%);
  padding:.9cqw 3cqw;font-size:1.6em;color:#fff;
  background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 4px 0 #b45309;
}
#shootButton:active{transform:translateX(-50%) scale(.95)}
#shootButton:disabled{filter:grayscale(.8) brightness(.8);cursor:default}
.hintbar{position:absolute;left:0;right:0;bottom:1.9cqw;text-align:center;font-weight:600;color:#3b2410;text-shadow:0 1px 0 rgba(255,255,255,.35)}

#streakPop{
  position:absolute;top:24%;left:50%;transform:translate(-50%,-50%) scale(.5);
  font-size:max(24px,4.4cqw);font-weight:900;color:#fff;text-shadow:0 0 20px var(--accent),0 2px 4px #000;
  opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap;
}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:12;background:rgba(8,12,22,.7);backdrop-filter:blur(4px)}
.overlay.hidden{display:none}
.panel{width:min(92%,560px);background:rgba(15,19,34,.96);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.panel-header{font-size:1.15em;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#f8fafc;margin-bottom:14px;text-align:center}
.mode-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.mode-tab{padding:10px 8px;border-radius:10px;background:rgba(255,255,255,.04);color:#cbd5e1;border:1px solid rgba(255,255,255,.1);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.mode-tab.active{background:linear-gradient(180deg,#fbbf24,#f97316);color:#1c1207;border-color:transparent}
.level-list{display:grid;gap:10px;max-height:min(66vh,460px);overflow:auto;padding-right:4px}
.level-option{display:grid;grid-template-columns:48px 1fr auto auto;align-items:center;gap:10px;width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.02);color:#fff;text-align:left}
.level-option:hover{background:rgba(255,255,255,.04)}
.level-option .num{font-weight:800;font-size:1.05em;color:#fbbf24;width:36px;text-align:center}
.level-option .name{font-weight:700}
.level-option .best{font-size:.9em;color:#cbd5e1}
.level-option .clear{font-size:.78em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:.35rem .7rem;background:rgba(34,197,94,.18);color:#86efac;border:1px solid rgba(34,197,94,.45)}
.level-option .clear[hidden]{display:none}
.level-option.active{outline:2px solid rgba(96,165,250,.9);box-shadow:0 0 0 2px rgba(96,165,250,.15)}
.complete-panel{text-align:center;padding:26px 22px 20px}
.complete-panel h2{font-size:clamp(1.5rem,3vw,2.3rem);font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
.complete-lines{display:grid;gap:8px;margin-bottom:18px}
.complete-line{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)}
.complete-line span{font-weight:700;color:#cbd5e1;letter-spacing:.08em;text-transform:uppercase}
.complete-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.complete-actions button,.panel-button{padding:12px 10px;border-radius:12px;font-size:.95em;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.complete-actions .primary,.panel-button.primary{background:linear-gradient(180deg,#fbbf24,#f97316);color:#1c1207}
.complete-actions button:not(.primary),.panel-button{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12)}
.complete-actions button[hidden]{display:none}
.complete-record{display:inline-block;margin:0 auto 16px;padding:6px 10px;border-radius:999px;background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.4);color:#86efac;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <!-- physics readout (toggle with the 📊 button or the P key) -->
      <div class="phys" id="physPanel">
        <div class="row aim" id="rowLaunch" title="Speed the ball leaves your hand with"><span>Launch</span><b id="roLaunch">—</b><i>m/s</i></div>
        <div class="row aim" title="Launch angle above the horizontal"><span>Angle</span><b id="roAngle">—</b><i>°</i></div>
        <div class="row aim" title="Before the shot: predicted peak height. During the shot: highest point so far"><span>Peak</span><b id="roPeak">—</b><i>m</i></div>
        <div class="sep"></div>
        <div class="row" title="Current speed of the ball"><span>Speed</span><b id="roSpeed">0.0</b><i>m/s</i></div>
        <div class="row" title="Height of the bottom of the ball above the floor"><span>Height</span><b id="roHeight">0.00</b><i>m</i></div>
        <div class="row" title="Kinetic energy = 1/2 m v²"><span>KE</span><b id="roKE">0.0</b><i>J</i></div>
        <div class="row" title="Gravitational potential energy = m g h"><span>PE</span><b id="roPE">0.0</b><i>J</i></div>
        <div class="row" title="KE + PE. Constant in the air, drops at every bounce"><span>Total</span><b id="roTotal">0.0</b><i>J</i></div>
      </div>

      <div class="top">
        <div class="level" id="levelLabel">LEVEL 1</div>
        <div class="pips" id="pips"><i></i><i></i><i></i></div>
        <div class="scorebar">
          <div class="chip chip-streak"><b id="streak">0</b><span>STREAK</span><small id="onFireTag">ON FIRE</small></div>
          <div class="chip main"><b id="score">0</b><span>SCORE</span></div>
          <div class="chip"><b id="best">0</b><span>BEST</span></div>
        </div>
      </div>

      <div class="tools">
        <button class="icon" id="muteButton" title="Mute sound (M)" aria-label="Mute sound">
          <svg id="soundOnIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
          <svg id="soundOffIcon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M4 4 20 20"/></svg>
        </button>
        <button class="icon" id="physButton" title="Physics panel (P)" aria-label="Physics panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        </button>
        <button class="icon" id="settingsButton" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></svg>
        </button>
        <button class="icon" id="menuButton" title="Level select (Esc)" aria-label="Level select">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="3" width="6" height="4" rx="1.5"/><rect x="3" y="15" width="4" height="6" rx="1.5"/><rect x="11" y="11" width="10" height="10" rx="1.5"/></svg>
        </button>
        <button class="icon" id="restartButton" title="Restart (R)" aria-label="Restart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
      <div class="settings" id="settingsPanel" hidden>
        <label><input type="checkbox" id="optInstant"> Release to shoot (instant fire)</label>
        <label><input type="checkbox" id="optAssist"> Rim assist (small magnet)</label>
        <label><input type="checkbox" id="optHitbox"> Show hitboxes (H)</label>
      </div>

      <button id="shootButton">SHOOT 🏀</button>
      <div class="hintbar" id="hintBar"></div>
    </div>

    <div id="streakPop"></div>

    <div id="menuOverlay" class="overlay">
      <div class="panel">
        <div class="panel-header">Level Select</div>
        <div id="modeTabs" class="mode-tabs"></div>
        <div id="menuLevels" class="level-list"></div>
      </div>
    </div>

    <div id="completeOverlay" class="overlay hidden">
      <div class="panel complete-panel">
        <h2 id="completeTitle">LEVEL 1 CLEARED!</h2>
        <div class="complete-lines">
          <div class="complete-line"><span id="completeMetricLabel">Score</span><strong id="completeScore">0</strong></div>
          <div class="complete-line"><span id="completeBestLabel">Best</span><strong id="completeBest">0</strong></div>
          <div class="complete-line"><span>Longest streak</span><strong id="completeStreak">0</strong></div>
        </div>
        <div id="completeRecord" class="complete-record" hidden>New record!</div>
        <div class="complete-actions">
          <button id="nextLevelButton" class="primary">Next Level</button>
          <button id="playAgainButton">Play Again</button>
          <button id="allLevelsButton">All Levels</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   OPTIONAL PICTURES
   Put your image files in an "assets" folder next to this file, then set the paths here.
   Anything left as null falls back to the drawn art, so you can add them one at a time.
   Press H in the game to show the hitboxes and line your hoop picture up with them.
   ===================================================================== */
const ASSETS={
  background:{src:"assets/mountain_full_background1.png"},
  ball:{src:"assets/basketball.png"},
  hoop:{
    src:null,                            // e.g. "assets/hoop.png"        (side view, rim on the left, backboard on the right, transparent background)
    // where the two ends of the rim are in YOUR picture, in pixels of the picture itself:
    rimLeftX:60, rimRightX:300, rimY:120,
    pole:false,                          // true = also draw/collide with the built-in pole
    board:null                           // optional hitbox override, e.g. {dx:0, dy:-80, width:15, height:150}
  }
};

const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const scoreEl=$("score"),streakEl=$("streak"),bestEl=$("best"),streakPop=$("streakPop");
const onFireTag=$("onFireTag");
const shootButton=$("shootButton"),restartButton=$("restartButton"),muteButton=$("muteButton");
const soundOnIcon=$("soundOnIcon"),soundOffIcon=$("soundOffIcon");
const physButton=$("physButton"),settingsButton=$("settingsButton"),settingsPanel=$("settingsPanel");
const menuButton=$("menuButton");
const menuOverlay=$("menuOverlay"),completeOverlay=$("completeOverlay");
const menuLevels=$("menuLevels");
const modeTabs=$("modeTabs");
const completeTitle=$("completeTitle"),completeScore=$("completeScore"),completeBest=$("completeBest");
const completeMetricLabel=$("completeMetricLabel"),completeBestLabel=$("completeBestLabel");
const completeStreak=$("completeStreak"),completeRecord=$("completeRecord");
const nextLevelButton=$("nextLevelButton"),playAgainButton=$("playAgainButton"),allLevelsButton=$("allLevelsButton");
const optInstant=$("optInstant"),optAssist=$("optAssist"),optHitbox=$("optHitbox");
const physPanel=$("physPanel"),levelLabel=$("levelLabel"),hintBar=$("hintBar");
const pips=$("pips");

const W=1000,H=600;
canvas.width=W;canvas.height=H;

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
};

// ---- units: the game runs in pixels, the readout shows real units ----
const FPS=60;                          // physics steps per second (fixed timestep)
const PX_PER_M=100;                    // 100 px = 1 m
const G=9.8;                           // m/s^2
const BALL_MASS=0.62;                  // kg
const gravity=G*PX_PER_M/(FPS*FPS);    // px per step^2 (about 0.272)
const FLOOR_Y=H-60;
const MAX_DRAG=300;
const POWER_SCALE=0.105;               // max launch speed = 300*0.105 px/step = 18.9 m/s
const MIN_ZOOM=0.3;
const FIRE_MS=13;                      // the ball "catches fire" above this speed (visual only)
const IMPACT_MS=5;                     // impacts faster than this get a shockwave (visual only)

// ---- levels ----
const POINTS={rim:1,swish:2,bank:3};
const MAX_MULT=5;
const HEARTS=5;
const TIME_START=30;
const TIME_MAX=60;
const TIME_BONUS={rim:2,swish:4,bank:4};
const FIRE_STREAK=3;
const GHOST_INTERVAL=3;
const LEVELS=[
  {name:"Warm-up",    ballX:250,hoopX:760,hoopY:230,amp:0,  period:0,target:20},
  {name:"Long range", ballX:180,hoopX:830,hoopY:210,amp:0,  period:0,target:30},
  {name:"Lift off",   ballX:160,hoopX:830,hoopY:230,amp:60, period:5,target:40},
  {name:"Elevator",   ballX:140,hoopX:840,hoopY:230,amp:100,period:4,target:50},
  {name:"Rocket",     ballX:130,hoopX:850,hoopY:230,amp:120,period:3,target:60}
];
function levelConfig(i){
  if(i<LEVELS.length)return LEVELS[i];
  const last=LEVELS[LEVELS.length-1];
  const extra=i-LEVELS.length+1;
  return {...last,name:"Level "+(i+1),period:Math.max(1.8,last.period-0.25*extra),target:last.target+10*extra};
}

// ---- settings (saved in the browser) ----
let instant=store.get("hoops_instant","1")==="1";   // release = fire
let assist=store.get("hoops_assist","1")==="1";
let showPhys=store.get("hoops_phys","1")==="1";
let showHitbox=false;
let muted=store.get("hoops_muted","0")==="1";

// ---- state ----
let mode="levels";
let score=0,streak=0,best=0,runMaxStreak=0,hearts=HEARTS,timeLeft=TIME_START;
let level=0,pendingLevelUp=false,playing=false,newRecord=false,timeExpired=false;
let mouseX=250,mouseY=460,dragging=false,isShooting=false,scoredThisShot=false;
let restTimer=0,shotTimer=0,maxH=0,fireAmt=0,shake=0;
let particles=[],flames=[],rings=[],netStretch=0,netVelocity=0,netSway=0,netSwayVelocity=0,flashAlpha=0,ballTrail=[];
let hint={text:"",t:0},banner={title:"",sub:"",t:0};
let ghostPath=[],ghostRecording=false;
const touched={rim:false,board:false};

// the locked-in aim: launch vector = (ball position - pull point), clamped to MAX_DRAG
const aim={dx:0,dy:0,set:false};
// camera: top-left corner of the view in world pixels + zoom
const cam={x:0,y:0,zoom:1};

const start={x:250,y:460};
const ball={x:250,y:460,radius:20,velocityX:0,velocityY:0,spin:0,color:"#f97316"};
const hoop={
  x:760,y:230,baseY:230,amp:0,omega:0,tick:0,vy:0,
  width:90,rimRadius:5,
  backboardWidth:15,backboardHeight:150,boardDX:0,boardDY:-110,hasPole:true
};

// ---- pictures (optional) ----
function loadImage(src){
  const rec={img:null,ok:false,onready:null};
  if(!src)return rec;
  const img=new Image();
  img.onload=()=>{rec.ok=true;if(rec.onready)rec.onready();};
  img.onerror=()=>{rec.ok=false;console.warn("Could not load image: "+src);};
  img.src=src;rec.img=img;
  return rec;
}
const IMG={background:loadImage(ASSETS.background.src),ball:loadImage(ASSETS.ball.src),hoop:loadImage(ASSETS.hoop.src)};
function applyHoopGeometry(){
  if(!IMG.hoop.ok)return;
  const A=ASSETS.hoop;
  hoop.hasPole=!!A.pole;
  if(A.board){hoop.boardDX=A.board.dx;hoop.boardDY=A.board.dy;hoop.backboardWidth=A.board.width;hoop.backboardHeight=A.board.height;}
}
IMG.hoop.onready=applyHoopGeometry;

function boardRect(){
  const l=hoop.x+hoop.width+hoop.boardDX,t=hoop.y+hoop.boardDY;
  return {l,t,r:l+hoop.backboardWidth,b:t+hoop.backboardHeight};
}
function poleRect(){const b=boardRect();return {l:b.l+5,t:b.b,r:b.l+20,b:FLOOR_Y};}

function ballHeightM(){return (FLOOR_Y-ball.y-ball.radius)/PX_PER_M;}
function speedMS(){return Math.hypot(ball.velocityX,ball.velocityY)*FPS/PX_PER_M;}

// ---- input (positions are converted to world coordinates so it still works while the camera moves) ----
function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const src=(e.touches&&e.touches.length)?e.touches[0]:e;
  const sx=(src.clientX-rect.left)*(W/rect.width),sy=(src.clientY-rect.top)*(H/rect.height);
  return {x:cam.x+sx/cam.zoom,y:cam.y+sy/cam.zoom};
}
function setPointer(e){const p=getPos(e);mouseX=p.x;mouseY=p.y;}

function updateAim(){
  let dx=ball.x-mouseX,dy=ball.y-mouseY;
  const d=Math.hypot(dx,dy);
  if(d<4){aim.set=false;return;}            // tiny drags cancel the aim
  if(d>MAX_DRAG){dx*=MAX_DRAG/d;dy*=MAX_DRAG/d;}
  aim.dx=dx;aim.dy=dy;aim.set=true;
}

function releaseDrag(){
  if(!playing||!dragging)return;
  dragging=false;
  if(instant&&aim.set)shoot();              // instant mode: letting go fires the shot
}

window.addEventListener("mousemove",e=>{if(playing&&dragging){setPointer(e);updateAim();}});
canvas.addEventListener("mousedown",e=>{if(!playing||isShooting)return;dragging=true;setPointer(e);updateAim();});
window.addEventListener("mouseup",releaseDrag);
canvas.addEventListener("touchstart",e=>{if(!playing||isShooting)return;dragging=true;setPointer(e);updateAim();e.preventDefault();},{passive:false});

window.addEventListener("touchend",releaseDrag);
window.addEventListener("touchcancel",()=>{dragging=false;});

function shoot(){
  if(!playing||isShooting)return;
  if(!aim.set){showHint("Drag back from the ball to aim first");return;}
  dragging=false;
  ball.velocityX=aim.dx*POWER_SCALE;
  ball.velocityY=aim.dy*POWER_SCALE;
  isShooting=true;scoredThisShot=false;shotTimer=0;restTimer=0;maxH=ballHeightM();
  touched.rim=false;touched.board=false;
  ghostPath=[];ghostRecording=true;
  const ms=speedMS();
  whoosh(Math.hypot(ball.velocityX,ball.velocityY));
  if(ms>=FIRE_MS){                          // power shot: launch burst
    spawnRing(ball.x,ball.y);spawnParticles(ball.x,ball.y,"#fde68a",22);shake=Math.max(shake,5);
  }
}

// ---- audio (tiny synth, no assets) ----
let actx;
function ensureAudio(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();return actx;}
function beep(freq,dur,type="sine",vol=0.15){
  if(muted)return;
  try{
    const ac=ensureAudio();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}
function whoosh(power){
  if(muted)return;
  try{
    const ac=ensureAudio();
    const bufSize=ac.sampleRate*0.18;
    const buf=ac.createBuffer(1,bufSize,ac.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*(1-i/bufSize);
    const src=ac.createBufferSource();src.buffer=buf;
    const filt=ac.createBiquadFilter();filt.type="bandpass";
    filt.frequency.setValueAtTime(600,ac.currentTime);
    filt.frequency.exponentialRampToValueAtTime(1800+power*20,ac.currentTime+0.15);
    const g=ac.createGain();g.gain.setValueAtTime(0.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.18);
    src.connect(filt);filt.connect(g);g.connect(ac.destination);src.start();
  }catch(e){}
}
function impactSound(speed,baseFreq,volume){
  const strength=Math.max(0,Math.min(1,speed/12));
  beep(baseFreq+strength*55,0.05+strength*0.09,"sine",volume*(0.2+strength*0.8));
}
function thud(speed){impactSound(speed,82,0.2);}
function missBuzz(){beep(180,0.1,"sawtooth",0.08);setTimeout(()=>beep(130,0.16,"sawtooth",0.08),90);}
function swishChime(){beep(660,0.08,"sine",0.16);setTimeout(()=>beep(880,0.1,"sine",0.16),60);setTimeout(()=>beep(1100,0.14,"sine",0.14),120);}
function levelChime(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.16,"triangle",0.14),i*110));}

// ---- effects ----
function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,color});
  }
}
function spawnRing(x,y){rings.push({x,y,r:ball.radius*0.8,life:1});}
// a hard hit: shockwave ring + sparks + a little screen shake (speedPx is the impact speed in px/step)
function impactFx(x,y,speedPx){
  const ms=speedPx*FPS/PX_PER_M;
  if(ms<IMPACT_MS)return;
  spawnRing(x,y);
  spawnParticles(x,y,"#fde68a",Math.min(20,Math.round(ms*1.2)));
  shake=Math.max(shake,Math.min(9,ms*0.5));
}
function emitFlames(amt){
  const n=1+Math.round(amt*3);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*1.5;
    flames.push({
      x:ball.x+(Math.random()-0.5)*ball.radius,y:ball.y+(Math.random()-0.5)*ball.radius,
      vx:-ball.velocityX*0.12+Math.cos(a)*s,vy:-ball.velocityY*0.12-0.8+Math.sin(a)*s,
      life:1,size:ball.radius*(0.5+Math.random()*0.5)
    });
  }
  if(flames.length>300)flames.splice(0,flames.length-300);
}

// ---- physics ----
// dt is a fraction of one step: fast shots are split into smaller sub-steps so the ball can't tunnel through thin things
function checkFloorCollision(dt){
  if(ball.y+ball.radius>=FLOOR_Y){
    const vIn=ball.velocityY;
    if(vIn>2.5)thud(vIn);
    if(vIn>0)impactFx(ball.x,FLOOR_Y,vIn);
    ball.y=FLOOR_Y-ball.radius;ball.velocityY*=-0.55;ball.velocityX*=Math.pow(0.85,dt);
    if(Math.abs(ball.velocityY)<1)ball.velocityY=0;
  }
}

// circle (the ball) against a rectangle that may be moving up/down at surfVY. Returns the impact speed, or 0.
function collideRect(l,t,r,b,restitution,friction,surfVY){
  const cx=Math.max(l,Math.min(ball.x,r)),cy=Math.max(t,Math.min(ball.y,b));
  const dx=ball.x-cx,dy=ball.y-cy,d2=dx*dx+dy*dy;
  if(d2>=ball.radius*ball.radius)return 0;
  let nx,ny,pen;
  if(d2>0){
    const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;pen=ball.radius-d;
  } else {
    // ball centre ended up inside the rectangle: push out through the nearest face
    const dl=ball.x-l,dr=r-ball.x,du=ball.y-t,dd=b-ball.y,m=Math.min(dl,dr,du,dd);
    if(m===dl){nx=-1;ny=0;pen=dl+ball.radius;}
    else if(m===dr){nx=1;ny=0;pen=dr+ball.radius;}
    else if(m===du){nx=0;ny=-1;pen=du+ball.radius;}
    else{nx=0;ny=1;pen=dd+ball.radius;}
  }
  ball.x+=nx*pen;ball.y+=ny*pen;
  // work in the surface's frame so a moving board hands momentum to the ball
  const rvx=ball.velocityX,rvy=ball.velocityY-surfVY;
  const vn=rvx*nx+rvy*ny;
  if(vn>=0)return 0;                      // already moving away
  let nvx=rvx-(1+restitution)*vn*nx,nvy=rvy-(1+restitution)*vn*ny;
  const tx=-ny,ty=nx,vt=nvx*tx+nvy*ty;
  nvx-=vt*friction*tx;nvy-=vt*friction*ty;
  ball.velocityX=nvx;ball.velocityY=nvy+surfVY;
  return -vn;
}

function checkBackboardCollision(){
  const b=boardRect();
  let hit=collideRect(b.l,b.t,b.r,b.b,0.55,0.1,hoop.vy);
  if(!hit&&hoop.hasPole){const p=poleRect();hit=collideRect(p.l,p.t,p.r,p.b,0.4,0.2,0);}
  if(hit>0){
    touched.board=true;
    if(hit>1.5)impactSound(hit,175,0.18);
    impactFx(ball.x+ball.radius*0.6,ball.y,hit);
  }
}

function dist(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;return Math.sqrt(dx*dx+dy*dy);}
function checkRimPointCollision(rimX,rimY){
  const d=dist(ball.x,ball.y,rimX,rimY),min=ball.radius+hoop.rimRadius;
  if(d<min){
    const nx=d?(ball.x-rimX)/d:0,ny=d?(ball.y-rimY)/d:-1;
    ball.x=rimX+nx*min;ball.y=rimY+ny*min;
    const rvy=ball.velocityY-hoop.vy;      // velocity relative to the (possibly moving) rim
    const v=ball.velocityX*nx+rvy*ny;
    if(v<0){                              // only bounce if moving into the rim
      let vx=ball.velocityX-1.5*v*nx,vy=rvy-1.5*v*ny;
      vx*=0.8;vy*=0.8;
      ball.velocityX=vx;ball.velocityY=vy+hoop.vy;
      touched.rim=true;
      if(-v>1)impactSound(-v,260,0.16);
      impactFx(rimX,rimY,-v);
    }
  }
}
function checkRimCollision(){checkRimPointCollision(hoop.x,hoop.y);checkRimPointCollision(hoop.x+hoop.width,hoop.y);}

// gentle magnet (ASSIST): if the ball is falling near the rim's mouth, nudge it toward the centre
function applyMagnet(dt){
  const cx=hoop.x+hoop.width/2,cy=hoop.y;
  if(ball.velocityY>0&&ball.y>cy-70&&ball.y<cy+15&&Math.abs(ball.x-cx)<hoop.width*0.7){
    ball.velocityX+=(cx-ball.x)*0.006*dt;
  }
}

function checkScore(){
  const hoopLeft=hoop.x,hoopRight=hoop.x+hoop.width,hoopY=hoop.y;
  if(!scoredThisShot&&ball.x>hoopLeft+4&&ball.x<hoopRight-4&&ball.y>hoopY&&ball.y<hoopY+22&&ball.velocityY>0){
    const type=touched.board?"bank":touched.rim?"rim":"swish";
    const multiplier=Math.min(streak+1,MAX_MULT);
    const points=POINTS[type]*multiplier;
    streak++;
    if(streak>runMaxStreak){runMaxStreak=streak;}
    if(mode==="time"){
      const streakKey="hoops_tastreak_"+level;
      const saved=parseInt(store.get(streakKey,"0"),10)||0;
      if(streak>saved){store.set(streakKey,String(streak));newRecord=true;}
    } else {
      const streakKey="hoops_streak_"+level;
      const saved=parseInt(store.get(streakKey,"0"),10)||0;
      if(streak>saved){store.set(streakKey,String(streak));newRecord=true;}
    }
    if(mode==="time" && !timeExpired){
      const bonus=TIME_BONUS[type];
      timeLeft=Math.min(TIME_MAX,timeLeft+bonus);
      const pop=document.createElement("div");
      pop.textContent="+"+bonus+"s";
      pop.className="bonus-pop";
      const timerWrap=document.querySelector(".timer-wrap");
      if(timerWrap){timerWrap.appendChild(pop);}
    }
    score+=points;
    if(mode==="time"){
      const bestKey="hoops_tabest_"+level;
      const savedScore=parseInt(store.get(bestKey,"0"),10)||0;
      if(score>savedScore){store.set(bestKey,String(score));best=score;newRecord=true;}
      else {best=savedScore;}
    } else {
      const target=levelConfig(level).target;
      if(score>=target){pendingLevelUp=true;}
      if(mode!=="time"){
        best=Math.max(best,runMaxStreak);
      }
    }
    updateHud();
    scoredThisShot=true;
    netVelocity+=Math.max(1,ball.velocityY*0.2);
    netSwayVelocity+=Math.sign(ball.velocityX||1)*Math.max(3,Math.min(7,Math.abs(ball.velocityX)*0.45));
    flashAlpha=0.35;
    spawnParticles(hoop.x+hoop.width/2,hoop.y+10,"#facc15",26);
    swishChime();
    const label=touched.board?"BANK SHOT!":touched.rim?"RIM IN!":"SWISH!";
    streakPop.textContent = label + " +" + points + (multiplier>1 ? "  x"+multiplier : "");
    streakPop.style.opacity=1;streakPop.style.transform="translate(-50%,-50%) scale(1)";
    clearTimeout(window._popT);
    window._popT=setTimeout(()=>{streakPop.style.opacity=0;streakPop.style.transform="translate(-50%,-50%) scale(.5)";},700);
  }
}

function stepPhysics(dt){
  // exact for constant gravity: y += v*dt + 1/2*g*dt^2, then v += g*dt
  ball.x+=ball.velocityX*dt;
  ball.y+=ball.velocityY*dt+0.5*gravity*dt*dt;
  ball.velocityY+=gravity*dt;
  ball.spin+=ball.velocityX*0.05*dt;
  if(assist)applyMagnet(dt);
  checkFloorCollision(dt);checkBackboardCollision();checkRimCollision();checkScore();
}

function endShot(){
  if(!scoredThisShot){
    streak=0;
    if(mode==="levels"){hearts=Math.max(0,hearts-1);if(hearts<=0){showGameOver();return;}}
    missBuzz();
  }
  if(mode==="time"&&timeExpired){
    showTimeUp();
    return;
  }
  resetBall();
  if(mode==="levels"&&pendingLevelUp){
    showComplete();
    return;
  }
  if(mode==="time"&&score>0){
    const highScoreKey="hoops_tabest_"+level;
    const saved=parseInt(store.get(highScoreKey,"0"),10)||0;
    if(score>saved){store.set(highScoreKey,String(score));best=score;}
  }
  updateHud();
}

function updateHoop(){
  hoop.tick++;
  if(hoop.amp>0){
    const ny=hoop.baseY+hoop.amp*Math.sin(hoop.omega*hoop.tick);
    hoop.vy=ny-hoop.y;hoop.y=ny;
  } else hoop.vy=0;
}

// ---- camera: zooms out / pans just enough to keep the ball (and the hoop) in view ----
function updateCamera(){
  let tz=1,tx=0,ty=0;
  if(isShooting){
    const m=80;
    const minX=Math.min(0,ball.x-ball.radius-m),maxX=Math.max(W,ball.x+ball.radius+m);
    const minY=Math.min(0,ball.y-ball.radius-m);
    const w=maxX-minX,h=H-minY;
    tz=Math.max(MIN_ZOOM,Math.min(1,W/w,H/h));
    const vw=W/tz,vh=H/tz;
    tx=(minX+maxX)/2-vw/2;
    ty=H-vh;                              // keep the floor anchored to the bottom
  }
  cam.zoom+=(tz-cam.zoom)*0.12;
  cam.x+=(tx-cam.x)*0.12;
  cam.y+=(ty-cam.y)*0.12;
  if(Math.abs(cam.zoom-1)<0.0005&&tz===1)cam.zoom=1;
  if(Math.abs(cam.x)<0.05&&tx===0)cam.x=0;
  if(Math.abs(cam.y)<0.05&&ty===0)cam.y=0;
}

function update(){
  updateHoop();
  if(mode==="time"&&playing&&isShooting&&!timeExpired){
    timeLeft=Math.max(0,timeLeft-1/FPS);
    if(timeLeft<=0){timeLeft=0;timeExpired=true;}
  }
  if(streak>=FIRE_STREAK){
    fireAmt=Math.max(fireAmt,1);
    emitFlames(0.5);
  }
  if(isShooting){
    shotTimer++;
    const speed=Math.hypot(ball.velocityX,ball.velocityY);
    const n=Math.max(1,Math.ceil(speed/8)),dt=1/n;
    let simTicks=0;
    for(let i=0;i<n;i++){
      stepPhysics(dt);
      simTicks++;
      if(ghostRecording&&simTicks%GHOST_INTERVAL===0){ghostPath.push({x:ball.x,y:ball.y});}
      if(ghostRecording&&ball.y+ball.radius>=FLOOR_Y-1&&Math.abs(ball.velocityY)<0.8){ghostRecording=false;}
    }
    ballTrail.push({x:ball.x,y:ball.y});
    if(ballTrail.length>14)ballTrail.shift();
    maxH=Math.max(maxH,ballHeightM());
    const speedFire=Math.max(0,Math.min(1,(speedMS()-FIRE_MS)/4));
    fireAmt=Math.max(speedFire,streak>=FIRE_STREAK?1:0);
    if(fireAmt>0)emitFlames(fireAmt);
    if(ball.x<-1500||ball.x>2500||ball.y>H+100||shotTimer>FPS*15){
      endShot();
    } else {
      const resting=ball.y+ball.radius>=FLOOR_Y-1&&Math.abs(ball.velocityX)<0.4&&Math.abs(ball.velocityY)<0.4;
      if(resting){
        restTimer++;
        if(restTimer>36)endShot();
      } else {
        restTimer=0;
      }
    }
  }
  updateCamera();
  netVelocity-=netStretch*0.14;
  netVelocity*=0.82;
  netStretch+=netVelocity;
  netSwayVelocity-=netSway*0.035;
  netSwayVelocity*=0.97;
  netSway+=netSwayVelocity;
  if(Math.abs(netStretch)<0.05&&Math.abs(netVelocity)<0.05){netStretch=0;netVelocity=0;}
  if(Math.abs(netSway)<0.05&&Math.abs(netSwayVelocity)<0.05){netSway=0;netSwayVelocity=0;}
  flashAlpha*=0.9;
  shake*=0.85;if(shake<0.2)shake=0;
  if(hint.t>0)hint.t--;
  if(banner.t>0)banner.t--;
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.02;});
  particles=particles.filter(p=>p.life>0);
  flames.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.05;p.size*=0.96;});
  flames=flames.filter(p=>p.life>0);
  rings.forEach(r=>{r.r+=3.4;r.life-=0.055;});
  rings=rings.filter(r=>r.life>0);
}

// ---- drawing ----
function drawSky(){                       // screen space: sun and clouds drift slowly (parallax)
  const sky=ctx.createLinearGradient(0,0,0,FLOOR_Y);
  sky.addColorStop(0,"#4a90d9");sky.addColorStop(1,"#bfe3f7");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  if(IMG.background.ok){
    const im=IMG.background.img,groundY=im.naturalHeight*0.878;
    const floorY=(FLOOR_Y-cam.y)*cam.zoom;
    const sc=Math.max(W/im.naturalWidth,floorY/groundY);
    const dw=im.naturalWidth*sc,dh=groundY*sc;
    const x=(W-dw)/2-cam.x*0.15*cam.zoom;
    ctx.drawImage(im,0,0,im.naturalWidth,groundY,x,floorY-dh,dw,dh);
    const hillL=x+im.naturalWidth*0.602*sc,hillR=x+im.naturalWidth*0.675*sc;
    ctx.fillStyle="#6e8667";
    ctx.beginPath();ctx.moveTo(hillL,floorY);ctx.quadraticCurveTo(x+im.naturalWidth*0.625*sc,floorY-42*sc,hillR,floorY);ctx.closePath();ctx.fill();
    return;
  }
  const px=-cam.x*0.15,py=-cam.y*0.15;
  ctx.fillStyle="rgba(255,250,210,0.9)";ctx.beginPath();ctx.arc(880+px,80+py,46,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,0.85)";
  [[150,90,40],[220,110,28],[500,60,34],[560,80,24]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x+px,y+py,r,0,Math.PI*2);ctx.fill();});
}

function drawCourt(){                     // world space
  const vx0=cam.x-60,vx1=cam.x+W/cam.zoom+60;
  // floor (extends far below so zooming out never shows a gap)
  const floor=ctx.createLinearGradient(0,FLOOR_Y,0,H);
  floor.addColorStop(0,"#e0a86b");floor.addColorStop(1,"#c17f3e");
  ctx.fillStyle=floor;ctx.fillRect(vx0,FLOOR_Y,vx1-vx0,3000);
  ctx.strokeStyle="#fff";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(vx0,FLOOR_Y);ctx.lineTo(vx1,FLOOR_Y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2,FLOOR_Y);ctx.lineTo(W/2,H);ctx.stroke();
  // shooting spot under the ball's starting position
  ctx.strokeStyle="rgba(255,255,255,0.85)";ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(start.x,FLOOR_Y+16,30,7,0,0,Math.PI*2);ctx.stroke();
}

function drawHoop(){
  const b=boardRect();
  if(hoop.hasPole){ctx.fillStyle="#333";ctx.fillRect(b.l+5,b.t,15,FLOOR_Y-b.t);}   // pole reaches the floor
  if(IMG.hoop.ok){
    const A=ASSETS.hoop,im=IMG.hoop.img,s=hoop.width/(A.rimRightX-A.rimLeftX);
    ctx.drawImage(im,hoop.x-A.rimLeftX*s,hoop.y-A.rimY*s,im.naturalWidth*s,im.naturalHeight*s);
    return;
  }
  ctx.fillStyle="#fff";ctx.fillRect(b.l,b.t,hoop.backboardWidth,hoop.backboardHeight);
  ctx.strokeStyle="#222";ctx.lineWidth=5;ctx.strokeRect(b.l,b.t,hoop.backboardWidth,hoop.backboardHeight);
  ctx.strokeStyle="#e63946";ctx.lineWidth=4;ctx.strokeRect(b.l-10,hoop.y-35,10,55);
  const rows=4,columns=5,netHeight=58+netStretch;
  const netPoint=(row,column)=>{
    const progress=row/rows,width=hoop.width*(0.8-0.38*progress);
    const center=hoop.x+hoop.width/2+netSway*progress*0.75;
    return {x:center-width/2+width*column/columns,y:hoop.y+4+netHeight*progress};
  };
  ctx.strokeStyle="#ffffff";ctx.lineWidth=1.6;
  ctx.beginPath();
  for(let row=0;row<=rows;row++){
    for(let column=0;column<=columns;column++){
      const point=netPoint(row,column);
      if(column<columns){
        const next=netPoint(row,column+1);
        ctx.moveTo(point.x,point.y);ctx.lineTo(next.x,next.y);
      }
      if(row<rows){
        if(column<columns){
          const next=netPoint(row+1,column+1);
          ctx.moveTo(point.x,point.y);ctx.lineTo(next.x,next.y);
        }
        if(column>0){
          const next=netPoint(row+1,column-1);
          ctx.moveTo(point.x,point.y);ctx.lineTo(next.x,next.y);
        }
      }
    }
  }
  ctx.stroke();
  ctx.strokeStyle="#e63946";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(hoop.x,hoop.y);ctx.lineTo(hoop.x+hoop.width,hoop.y);ctx.stroke();
  ctx.fillStyle="#e63946";
  ctx.beginPath();ctx.arc(hoop.x,hoop.y,hoop.rimRadius,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hoop.x+hoop.width,hoop.y,hoop.rimRadius,0,Math.PI*2);ctx.fill();
}

// green outlines of everything the ball can collide with (press H) - use it to line up your hoop picture
function drawHitboxes(){
  ctx.strokeStyle="#22ff66";ctx.lineWidth=2;ctx.setLineDash([6,4]);
  const b=boardRect();ctx.strokeRect(b.l,b.t,b.r-b.l,b.b-b.t);
  if(hoop.hasPole){const p=poleRect();ctx.strokeRect(p.l,p.t,p.r-p.l,p.b-p.t);}
  [hoop.x,hoop.x+hoop.width].forEach(x=>{ctx.beginPath();ctx.arc(x,hoop.y,hoop.rimRadius,0,Math.PI*2);ctx.stroke();});
  ctx.beginPath();ctx.moveTo(hoop.x,hoop.y);ctx.lineTo(hoop.x+hoop.width,hoop.y);ctx.stroke();
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
}

function drawTrail(){
  ballTrail.forEach((p,i)=>{
    ctx.globalAlpha=(i/ballTrail.length)*0.35;
    ctx.fillStyle="#f97316";
    ctx.beginPath();ctx.arc(p.x,p.y,ball.radius*0.6,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawFlames(){
  if(!flames.length)return;
  ctx.globalCompositeOperation="lighter";
  flames.forEach(p=>{
    const c=p.life>0.65?"255,236,170":p.life>0.35?"251,146,60":"239,68,68";
    ctx.fillStyle=`rgba(${c},${Math.min(1,p.life)*0.55})`;
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(p.size,0.5),0,Math.PI*2);ctx.fill();
  });
  ctx.globalCompositeOperation="source-over";
}

function drawRings(){
  rings.forEach(r=>{
    ctx.strokeStyle=`rgba(255,255,255,${Math.max(r.life,0)*0.85})`;
    ctx.lineWidth=1+3*r.life;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();
  });
}

function drawBall(){
  const scale=1-Math.max(0,(ball.y-500))*0.00015;
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.beginPath();ctx.ellipse(ball.x,H-65,ball.radius*scale,5,0,0,Math.PI*2);ctx.fill();
  if(fireAmt>0.02){                         // fire glow behind the ball
    const g=ctx.createRadialGradient(ball.x,ball.y,ball.radius*0.5,ball.x,ball.y,ball.radius*2.6);
    g.addColorStop(0,`rgba(255,200,80,${0.55*fireAmt})`);g.addColorStop(1,"rgba(255,80,0,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.radius*2.6,0,Math.PI*2);ctx.fill();
  }
  ctx.save();
  ctx.translate(ball.x,ball.y);ctx.rotate(ball.spin);
  if(IMG.ball.ok){
    ctx.drawImage(IMG.ball.img,-ball.radius,-ball.radius,ball.radius*2,ball.radius*2);
  } else {
    ctx.fillStyle=ball.color;
    ctx.beginPath();ctx.arc(0,0,ball.radius,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#5a2500";ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle="#5a2500";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,ball.radius*0.8,-Math.PI/2,Math.PI/2);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,ball.radius*0.8,Math.PI/2,Math.PI*1.5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-ball.radius,0);ctx.quadraticCurveTo(0,-8,ball.radius,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-ball.radius,0);ctx.quadraticCurveTo(0,8,ball.radius,0);ctx.stroke();
  }
  ctx.restore();
}

// angle gauge: centred on the ball, from the horizontal to the launch direction
function drawAngleGauge(){
  const theta=Math.atan2(-aim.dy,aim.dx);              // launch angle above the horizontal (up is positive)
  if(Math.abs(theta)<0.02)return;
  const R=52;
  ctx.strokeStyle="rgba(255,255,255,0.55)";ctx.lineWidth=2;ctx.setLineDash([4,5]);
  ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+R+26,ball.y);ctx.stroke();   // horizontal reference
  ctx.setLineDash([]);
  ctx.strokeStyle="#9cc9ff";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(ball.x,ball.y,R,0,-theta,theta>0);ctx.stroke();
  const mid=-theta/2,lx=ball.x+(R+24)*Math.cos(mid),ly=ball.y+(R+24)*Math.sin(mid);
  ctx.font="bold 15px 'Segoe UI',Arial,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  const label=Math.round(theta*180/Math.PI)+"°";
  ctx.lineWidth=3;ctx.strokeStyle="rgba(0,0,0,0.55)";ctx.strokeText(label,lx,ly);
  ctx.fillStyle="#fff";ctx.fillText(label,lx,ly);
  ctx.textAlign="start";ctx.textBaseline="alphabetic";
}

function drawAim(){
  if(isShooting)return;
  if(ghostPath.length>1){
    ctx.save();
    ctx.strokeStyle="rgba(255,255,255,0.35)";
    ctx.lineWidth=2;
    ctx.setLineDash([8,8]);
    ctx.beginPath();
    ghostPath.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});
    ctx.stroke();
    ctx.restore();
  }
  if(aim.set){
    const pullX=ball.x-aim.dx,pullY=ball.y-aim.dy;            // where the "slingshot" is pulled to
    const d=Math.hypot(aim.dx,aim.dy);
    const launchMS=Math.hypot(aim.dx,aim.dy)*POWER_SCALE*FPS/PX_PER_M,fireShot=launchMS>=FIRE_MS;
    ctx.strokeStyle="rgba(255,255,255,0.8)";ctx.lineWidth=3;ctx.setLineDash([8,8]);
    ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(pullX,pullY);ctx.stroke();
    ctx.setLineDash([]);
    drawAngleGauge();
    // predicted trajectory (opposite of the pull)
    const vx=aim.dx*POWER_SCALE,vy0=aim.dy*POWER_SCALE;
    const canJudge=hoop.amp===0;                              // a moving hoop can't be judged from here
    let onTarget=false;
    for(let i=0;i<40;i++){
      const t=i+1,px=ball.x+vx*t,py=ball.y+vy0*t+0.5*gravity*t*t,vy=vy0+gravity*t;
      if(canJudge&&vy>0&&Math.abs(px-(hoop.x+hoop.width/2))<hoop.width*0.5&&py>hoop.y-15&&py<hoop.y+15)onTarget=true;
      ctx.fillStyle=onTarget?"rgba(74,222,128,0.8)":fireShot?"rgba(255,170,80,0.85)":"rgba(255,255,255,0.55)";
      if(i%2===0){ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();}
      if(py>FLOOR_Y)break;
    }
    ctx.fillStyle=onTarget?"#4ade80":`hsl(${Math.min(d/MAX_DRAG*120,120)},80%,55%)`;
    ctx.beginPath();ctx.arc(pullX,pullY,8,0,Math.PI*2);ctx.fill();
    if(fireShot){
      ctx.font="bold 15px 'Segoe UI',Arial,sans-serif";ctx.textAlign="center";
      ctx.lineWidth=3;ctx.strokeStyle="rgba(0,0,0,0.55)";ctx.strokeText("🔥 FIRE SHOT",pullX,pullY-18);
      ctx.fillStyle="#ffd089";ctx.fillText("🔥 FIRE SHOT",pullX,pullY-18);
      ctx.textAlign="start";
    }
  } else {
    ctx.strokeStyle="rgba(255,255,255,0.5)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.radius+6,0,Math.PI*2);ctx.stroke();
  }
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(p.life,0);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

// arrow at the screen edge pointing at the ball when it is out of view (only at the camera's max zoom-out)
function drawOffscreen(){
  const sx=(ball.x-cam.x)*cam.zoom,sy=(ball.y-cam.y)*cam.zoom,r=ball.radius*cam.zoom;
  if(sx>=-r&&sx<=W+r&&sy>=-r&&sy<=H+r)return;
  const m=22,cx=Math.max(m,Math.min(W-m,sx)),cy=Math.max(m,Math.min(H-m,sy));
  const a=Math.atan2(sy-cy,sx-cx);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
  ctx.fillStyle="#f97316";ctx.strokeStyle="#fff";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-10,-11);ctx.lineTo(-10,11);ctx.closePath();ctx.stroke();ctx.fill();
  ctx.restore();
  const label=ballHeightM().toFixed(1)+" m";
  const tx=Math.max(34,Math.min(W-34,cx)),ty=cy<H/2?cy+34:cy-24;
  ctx.font="bold 14px 'Segoe UI',Arial,sans-serif";ctx.textAlign="center";
  ctx.lineWidth=3;ctx.strokeStyle="rgba(0,0,0,0.6)";ctx.strokeText(label,tx,ty);
  ctx.fillStyle="#fff";ctx.fillText(label,tx,ty);
  ctx.textAlign="start";
}

function drawHint(){
  if(hint.t<=0)return;
  ctx.globalAlpha=Math.min(1,hint.t/20);
  ctx.font="bold 20px 'Segoe UI',Arial,sans-serif";ctx.textAlign="center";
  const w=ctx.measureText(hint.text).width;
  ctx.fillStyle="rgba(11,16,32,0.8)";ctx.fillRect(W/2-w/2-16,150,w+32,42);
  ctx.fillStyle="#fff";ctx.fillText(hint.text,W/2,178);
  ctx.textAlign="start";ctx.globalAlpha=1;
}

function drawBanner(){
  if(banner.t<=0)return;
  ctx.globalAlpha=Math.min(1,banner.t/30);
  ctx.textAlign="center";
  ctx.font="900 64px 'Segoe UI',Arial,sans-serif";
  ctx.lineWidth=8;ctx.strokeStyle="rgba(11,16,32,0.75)";ctx.strokeText(banner.title,W/2,250);
  ctx.fillStyle="#fb923c";ctx.fillText(banner.title,W/2,250);
  ctx.font="700 26px 'Segoe UI',Arial,sans-serif";
  ctx.lineWidth=5;ctx.strokeText(banner.sub,W/2,290);
  ctx.fillStyle="#fff";ctx.fillText(banner.sub,W/2,290);
  ctx.textAlign="start";ctx.globalAlpha=1;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.3)ctx.translate((Math.random()-0.5)*shake*2,(Math.random()-0.5)*shake*2);
  drawSky();
  ctx.save();
  ctx.scale(cam.zoom,cam.zoom);ctx.translate(-cam.x,-cam.y);
  drawCourt();drawHoop();drawTrail();drawAim();drawFlames();drawBall();drawRings();drawParticles();
  if(showHitbox)drawHitboxes();
  ctx.restore();
  if(flashAlpha>0.01){ctx.fillStyle=`rgba(250,204,21,${flashAlpha})`;ctx.fillRect(0,0,W,H);}
  drawOffscreen();drawHint();drawBanner();
  ctx.restore();
}

// ---- physics readout ----
const ro={
  launch:$("roLaunch"),angle:$("roAngle"),peak:$("roPeak"),
  speed:$("roSpeed"),height:$("roHeight"),
  ke:$("roKE"),pe:$("roPE"),total:$("roTotal")
};
const rowLaunch=$("rowLaunch");
function setText(el,v){if(el.textContent!==v)el.textContent=v;}
function updateReadout(){
  if(!showPhys)return;
  // from the locked-in aim
  if(aim.set){
    const vx=aim.dx*POWER_SCALE,vy=aim.dy*POWER_SCALE,lms=Math.hypot(vx,vy)*FPS/PX_PER_M;
    setText(ro.launch,lms.toFixed(1));
    setText(ro.angle,(Math.atan2(-vy,vx)*180/Math.PI).toFixed(0));
    rowLaunch.classList.toggle("hot",lms>=FIRE_MS);
    if(isShooting){
      setText(ro.peak,maxH.toFixed(2));
    } else {
      const up=Math.max(0,-vy);                                  // upward speed in px/step
      setText(ro.peak,(ballHeightM()+(up*up/(2*gravity))/PX_PER_M).toFixed(2));
    }
  } else {
    setText(ro.launch,"—");setText(ro.angle,"—");setText(ro.peak,"—");
    rowLaunch.classList.toggle("hot",false);
  }
  // live values
  const v=speedMS();
  const h=Math.max(0,ballHeightM());
  const ke=0.5*BALL_MASS*v*v,pe=BALL_MASS*G*h;
  setText(ro.speed,v.toFixed(1));
  setText(ro.height,h.toFixed(2));
  setText(ro.ke,ke.toFixed(1));
  setText(ro.pe,pe.toFixed(1));
  setText(ro.total,(ke+pe).toFixed(1));
}

// ---- main loop: fixed 60 Hz physics, so the game runs at the same speed on any monitor ----
const STEP=1000/FPS;
let lastTime=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(now-lastTime,100);lastTime=now;
  while(acc>=STEP){update();acc-=STEP;}
  if(shootButton.disabled!==isShooting)shootButton.disabled=isShooting;
  draw();updateReadout();
  requestAnimationFrame(loop);
}
applyLevel();
resetBall();
showMenu();
updateHud();
requestAnimationFrame(loop);
</script>
</body>
